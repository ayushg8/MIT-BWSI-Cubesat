[project]
name = "muraltz-cubesat"
version = "1.0.0"
description = "Flight software for the MuraltZ student CubeSat (MIT BWSI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
hardware = [
    "adafruit-circuitpython-lsm6ds>=4.5,<5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["cubesat_flight"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"cubesat_flight/test_*.py" = ["E402"]
